services:
  etekcity-scale-daemon:
    build: .
    # BLE access needs the host's D-Bus system bus and Bluetooth adapter.
    # Host networking and the /var/run/dbus mount below are the standard
    # way to reach both from inside a container. UNVERIFIED -- see the
    # Docker section of the README before relying on this.
    network_mode: host
    volumes:
      - /var/run/dbus:/var/run/dbus
      - ./config:/etc/etekcity-scale-daemon
      - ./data:/var/lib/etekcity-scale-daemon
    restart: unless-stopped
